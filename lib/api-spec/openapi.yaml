      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Support chats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminSupportChat"

  /admin/support/chats/{chatId}/messages:
    get:
      operationId: getAdminSupportMessages
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Support messages
          content:
            application/json:
              schema:
