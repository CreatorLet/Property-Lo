    post:
      operationId: sendAdminSupportMessage
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportMessage"

  /admin/ads:
    get:
      operationId: getAdminAds
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All ads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ad"
    post:
      operationId: createAd
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdInput"
      responses:
        "201":
          description: Created ad
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ad"

  /admin/ads/{id}:
    patch:
      operationId: updateAd
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdUpdate"
      responses:
        "200":
          description: Updated ad
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ad"
    delete:
      operationId: deleteAd
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/contact-messages:
    get:
      operationId: getContactMessages
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Contact messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContactMessage"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    UnreadCountResponse:
      type: object
      required: [count]
      properties:
        count:
          type: integer

    ChatIdResponse:
      type: object
      required: [id]
      properties:
        id:
          type: string

    # ── Auth schemas ──────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, email, full_name, role, status, created_at]
      properties:
        id:
          type: string
        email:
          type: string
        full_name:
          type: string
        phone:
          type: ["string", "null"]
        role:
          type: string
        status:
          type: string
        avatar_base64:
          type: ["string", "null"]
        created_at:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    SignupInput:
      type: object
      required: [email, password, full_name]
      properties:
        email:
          type: string
        password:
          type: string
        full_name:
          type: string
        phone:
          type: string

    VerifyOtpInput:
      type: object
      required: [email, otp]
      properties:
        email:
          type: string
        otp:
          type: string

    SigninInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    EmailInput:
      type: object
      required: [email]
      properties:
        email:
          type: string

    ResetPasswordInput:
      type: object
      required: [email, otp, new_password]
      properties:
        email:
          type: string
        otp:
          type: string
        new_password:
          type: string

    ProfileUpdate:
      type: object
      required: [full_name]
      properties:
        full_name:
          type: string
        phone:
          type: string

    PasswordUpdate:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string

    AvatarUpdate:
      type: object
      required: [avatar_base64]
      properties:
        avatar_base64:
          type: string

    # ── Listing schemas ───────────────────────────────────────────────────────
    Listing:
      type: object
      required: [id, title, description, type, purpose, price, location, state, images, status, created_at]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        type:
          type: string
        purpose:
          type: string
        price:
          type: number
        location:
          type: string
        state:
          type: string
        size:
          type: ["string", "null"]
        bedrooms:
          type: ["integer", "null"]
        bathrooms:
          type: ["integer", "null"]
        images:
          type: array
          items:
            type: string
        status:
          type: string
        contact_email:
          type: ["string", "null"]
        contact_phone:
          type: ["string", "null"]
        user_id:
          type: ["string", "null"]
        created_at:
          type: string

